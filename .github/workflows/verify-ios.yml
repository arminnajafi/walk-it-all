name: Verify iOS

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: brew install xcodegen uv

      - name: Verify matching core
        working-directory: Packages/WalkItAllCore
        run: swift run WalkItAllCoreChecks

      - name: Verify offline-map builder
        working-directory: Tools/CityPackBuilder
        run: |
          uv sync --dev
          uv run pytest -q

      - name: Verify bundled Manhattan database
        run: |
          sqlite3 WalkItAll/Resources/OfflineMaps/manhattan-v1.sqlite 'PRAGMA integrity_check; SELECT count(*) FROM segments;'

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run app and tests
        run: |
          simulator_id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          document = json.load(sys.stdin)
          for runtime, devices in document["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator")
          ' )"
          xcodebuild \
            -project WalkItAll.xcodeproj \
            -scheme WalkItAll \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO \
            test
