[project]
name = "walk-it-all-city-pack-builder"
version = "0.1.0"
description = "Build reproducible offline walking-network packages for Walk It All"
requires-python = ">=3.13,<3.14"
dependencies = [
  "osmium>=4.0,<5",
  "shapely>=2.1,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
walkitall-build-city-pack = "city_pack_builder.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["city_pack_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

